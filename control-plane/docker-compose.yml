# Aegis.net Control Plane Docker Compose
# Development environment

services:
  # Control Plane API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://aegis:aegis@postgres:5432/aegis
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-me}
      - DEBUG=true
    depends_on:
      - postgres
      - redis
    volumes:
      - ./api:/app/api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=aegis
      - POSTGRES_PASSWORD=aegis
      - POSTGRES_DB=aegis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U aegis" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Aegis Edge Node (OpenResty)
  edge:
    build:
      context: ../edge/openresty
      dockerfile: Dockerfile
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      # Mount Lua code for hot-reloading
      - ../edge/openresty/aegis.lua:/usr/local/openresty/lualib/aegis/aegis.lua
      # Mount nginx config
      - ../edge/openresty/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf
      # Mount protection template (we need to map this path correctly or update code)
      - ../website/protection.html:/usr/local/openresty/lualib/aegis/protection.html
    depends_on:
      - redis
      - api
    restart: unless-stopped

  # Origin Website (The site we are protecting)
  website:
    image: nginx:alpine
    ports:
      - "3000:80" # Exposed directly for comparison
    volumes:
      - ../website:/usr/share/nginx/html
    restart: unless-stopped

  # Celery Worker (for background tasks)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://aegis:aegis@postgres:5432/aegis
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-me}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./api:/app/api
    command: celery -A workers.celery_app worker --loglevel=info
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

# Aegis.net Edge Node - OpenResty Configuration
# /etc/nginx/nginx.conf

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    # Lua modules path
    lua_package_path "/usr/local/openresty/lualib/aegis/?.lua;;";
    lua_shared_dict aegis_cache 100m;
    lua_shared_dict aegis_rate_limit 50m;
    
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Logging
    log_format aegis_json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"'
    '}';
    
    access_log /var/log/nginx/access.log aegis_json;
    error_log /var/log/nginx/error.log warn;
    
    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;
    
    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    
    # Upstream for control plane
    upstream control_plane {
        server control-plane:8000;
        keepalive 32;
    }
    
    # Default server - catch-all
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        
        ssl_certificate /etc/nginx/ssl/default.crt;
        ssl_certificate_key /etc/nginx/ssl/default.key;
        
        return 444;
    }
    
    # Protected site template
    # Real deployments would use dynamic configuration via Lua
    server {
        listen 80;
        listen 443 ssl;
        
        server_name _;
        
        # SSL (use SNI-based cert selection in production)
        ssl_certificate /etc/nginx/ssl/default.crt;
        ssl_certificate_key /etc/nginx/ssl/default.key;
        
        # Real IP from our edge
        set_real_ip_from 10.0.0.0/8;
        real_ip_header X-Real-IP;
        
        # Aegis WAF
        access_by_lua_block {
            local aegis = require "aegis"
            aegis.access()
        }
        
        log_by_lua_block {
            local aegis = require "aegis"
            aegis.log()
        }
        
        # Proxy to origin
        location / {
            proxy_pass $origin_url;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
        }
        
        # Health check endpoint
        location /aegis-health {
            access_log off;
            return 200 "OK";
        }
        
        # Internal API for control plane
        location /aegis-api/ {
            internal;
            proxy_pass http://control_plane/;
        }
    }
}

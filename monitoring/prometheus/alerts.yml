groups:
  - name: aegis_alerts
    interval: 30s
    rules:
      # High request rate (potential DDoS)
      - alert: HighRequestRate
        expr: rate(nginx_http_requests_total[1m]) > 1000
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High request rate detected"
          description: "Request rate is {{ $value }} req/s (threshold: 1000)"

      # Critical attack rate
      - alert: CriticalAttackRate
        expr: rate(nginx_http_requests_total[1m]) > 5000
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: Massive attack detected"
          description: "Request rate is {{ $value }} req/s (threshold: 5000)"

      # High block rate
      - alert: HighBlockRate
        expr: (rate(nginx_http_requests_total{status="503"}[5m]) / rate(nginx_http_requests_total[5m])) > 0.8
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "High block rate"
          description: "{{ $value | humanizePercentage }} of requests are being blocked"

      # Service down
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been down for more than 1 minute"

      # High CPU usage
      - alert: HighCPUUsage
        expr: (100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}%"

      # High memory usage
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value }}%"
